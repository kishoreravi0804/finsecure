version: 0.2

phases:
  pre_build:
    commands:
      - cd finsecure
      - chmod +x mvnw
      - ./mvnw clean package -DskipTests
      - mvn clean install
      - echo Logging in to Amazon ECR...
      - aws --version
      - REPOSITORY_URI=974263621300.dkr.ecr.ap-south-1.amazonaws.com/finsecure
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 974263621300.dkr.ecr.ap-south-1.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...

      # DEBUG (important)
      - pwd
      - ls
      - docker build -t finsecure .

      # TAG correctly
      - docker tag finsecure:latest $REPOSITORY_URI:latest
      - docker tag finsecure:latest $REPOSITORY_URI:$IMAGE_TAG

      # VERIFY image exists
      - docker images

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...

      # DEBUG before push
      - docker images

      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo Writing image definitions file...
      - printf '[{"name":"course-service","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo Writing image definitions file...
      - DOCKER_CONTAINER_NAME=finsecure
      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo $DOCKER_CONTAINER_NAME
      - echo printing imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - finsecure/target/finsecure-0.0.1-SNAPSHOT.jar