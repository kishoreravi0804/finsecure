version: 0.2

env:
  variables:
    REPOSITORY_URI: "974263621300.dkr.ecr.ap-south-1.amazonaws.com/finsecure"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 974263621300.dkr.ecr.ap-south-1.amazonaws.com
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

  build:
    commands:
      - echo Build started on `date`
      - cd finsecure
      - chmod +x mvnw
      - ./mvnw clean package -DskipTests
      
      - echo Building Docker image...
      # Build and tag in one go to ensure the local daemon registers it correctly
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker images...
      # Using braces ${} ensures the variable is interpreted correctly by the shell
      - docker push ${REPOSITORY_URI}:latest
      - docker push ${REPOSITORY_URI}:${IMAGE_TAG}
      - echo Writing image definitions file...
      - printf '[{"name":"finsecure","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
artifacts:
  files:
   - imagedefinitions.json